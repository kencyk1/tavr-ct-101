<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Bricolage Grotesque";src:url(node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2) format("woff2");font-weight:200 800}
@font-face{font-family:"IBM Plex Sans";src:url(node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2) format("woff2");font-weight:400}
@font-face{font-family:"IBM Plex Sans";src:url(node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2) format("woff2");font-weight:600}
@font-face{font-family:"IBM Plex Mono";src:url(node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2) format("woff2");font-weight:500}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;background:#080C0F;overflow:hidden}
.card{position:relative;width:1200px;height:630px;background:radial-gradient(120% 90% at 85% 10%,#121B22 0%,#080C0F 60%);color:#E3E9ED;font-family:"IBM Plex Sans",sans-serif}
.shots{position:absolute;left:36px;top:30px;width:580px;height:570px;display:grid;grid-template-columns:264px 300px;grid-template-rows:300px 260px;gap:10px 16px}
.shot{position:relative;overflow:hidden;border-radius:10px;background:#000}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.body{grid-row:1/span 2}
.body::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000 0,rgba(0,0,0,0) 46px,rgba(0,0,0,0) calc(100% - 46px),#000 100%);pointer-events:none}
.ann{box-shadow:inset 0 0 0 2px #F0A43A}
.viv{box-shadow:inset 0 0 0 2px #5CC48A}
.ann img,.viv img{z-index:0}.ann::after,.viv::after{content:"";position:absolute;inset:0;border-radius:10px;box-shadow:inset 0 0 0 2px var(--b);z-index:1}
.ann{--b:#F0A43A}.viv{--b:#5CC48A}
.text{position:absolute;left:668px;right:48px;top:70px;bottom:44px;display:flex;flex-direction:column}
.brandrow{display:flex;align-items:center;gap:16px}
.icon{width:58px;height:58px;display:block}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:15px;letter-spacing:.09em;text-transform:uppercase;color:#93A1AC}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:750;font-size:108px;line-height:.92;letter-spacing:-.025em;margin-top:30px}
h1 span{color:#F0A43A}
.tag{font-size:29px;line-height:1.3;color:#C9D3DA;margin-top:22px;max-width:470px}
.chips{font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:16px;letter-spacing:.04em;color:#93A1AC;margin-top:18px}
.chips b{color:#55C3D3;font-weight:500}
.foot{margin-top:auto;display:grid;gap:4px}
.url{font-weight:600;font-size:24px;color:#F0A43A}
.free{font-size:17px;color:#7E8A93}
</style></head><body><div class="card">
  <div class="shots">
    <div class="shot body"><img src="img-body.png" alt=""></div>
    <div class="shot ann"><img src="img-ann.png" alt=""></div>
    <div class="shot viv"><img src="img-viv.png" alt=""></div>
  </div>
  <div class="text">
    <div class="brandrow"><img class="icon" src="icon.svg" alt=""><span class="eyebrow">Companion to LubDubAPP Guide</span></div>
    <h1>TAVR CT<br><span>101</span></h1>
    <p class="tag">Hands-on CT for structural heart APP training</p>
    <p class="chips">Real CTA <b>·</b> MPR lab <b>·</b> Valve-in-valve</p>
    <div class="foot"><span class="url">ct.lubdubappguide.com</span><span class="free">Free for non-commercial education</span></div>
  </div>
</div></body></html>
